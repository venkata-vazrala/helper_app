name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  deny-personal:
    name: No personal identifiers in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan
        run: |
          # Built in pieces so this file does not match the search.
          PATTERN="$(printf '%s' 'venkata' 'gunasekharv' '|' 'vgse' 'ce@' '|' 'Venkata' ' Gunasekhar')"
          set +e
          HITS="$(git grep -I -n -E "$PATTERN" -- . ':!target' ':!.git')"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "$HITS"
            echo "Personal identifiers found in the repository." >&2
            exit 1
          fi
          if [ "$STATUS" -gt 1 ]; then
            echo "git grep failed with status $STATUS" >&2
            exit "$STATUS"
          fi
          echo "Clean."
