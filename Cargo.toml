[package]
name = "helper"
version = "0.1.0"
edition = "2024"
description = "Personal workspace helper: files, notes, and copy-ready snippets"
license = "MIT"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
