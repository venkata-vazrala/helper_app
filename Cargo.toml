[package]
name = "helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local desktop workspace: files, notes, snippets, and configurable open-with launchers"
license = "MIT"
readme = "README.md"
keywords = ["desktop", "workspace", "notes"]
categories = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[dependencies]
arboard = "3"
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
