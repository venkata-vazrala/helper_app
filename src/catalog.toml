# Built-in Open-with catalog. Add a new app by appending an [[apps]] table.
# platforms: macos | linux | windows
# detect: PATH command names, or absolute /Applications paths, or ~/...

[[apps]]
id = "finder"
name = "Finder"
platforms = ["macos"]
command = "open"
args = ["{path}"]
detect = ["/System/Library/CoreServices/Finder.app"]

[[apps]]
id = "vscode"
name = "VS Code"
platforms = ["macos", "linux", "windows"]
command = "code"
args = ["--", "{path}"]
detect = ["code"]

[[apps]]
id = "cursor"
name = "Cursor"
platforms = ["macos", "linux", "windows"]
command = "cursor"
args = ["--", "{path}"]
detect = ["cursor", "/Applications/Cursor.app"]

[[apps]]
id = "antigravity"
name = "Antigravity IDE"
platforms = ["macos"]
command = "open"
args = ["-a", "Antigravity IDE", "{path}"]
detect = ["/Applications/Antigravity IDE.app"]

[[apps]]
id = "zed"
name = "Zed"
platforms = ["macos", "linux"]
command = "zed"
args = ["{path}"]
detect = ["zed", "/Applications/Zed.app"]

[[apps]]
id = "sublime"
name = "Sublime Text"
platforms = ["macos", "linux", "windows"]
command = "subl"
args = ["{path}"]
detect = ["subl", "/Applications/Sublime Text.app"]

[[apps]]
id = "xcode"
name = "Xcode"
platforms = ["macos"]
